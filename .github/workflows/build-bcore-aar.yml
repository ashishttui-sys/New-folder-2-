name: Build Bcore AAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'NewBlackbox/Bcore/**'
      - 'NewBlackbox/black-reflection/**'
      - 'NewBlackbox/compiler/**'
      - 'NewBlackbox/build.gradle'
      - 'NewBlackbox/settings.gradle'
      - 'NewBlackbox/gradle/**'
      - '.github/workflows/build-bcore-aar.yml'
  pull_request:
    paths:
      - 'NewBlackbox/Bcore/**'
      - 'NewBlackbox/black-reflection/**'
      - 'NewBlackbox/compiler/**'
      - 'NewBlackbox/build.gradle'
      - 'NewBlackbox/settings.gradle'
      - 'NewBlackbox/gradle/**'
      - '.github/workflows/build-bcore-aar.yml'

jobs:
  build-aar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewBlackbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Bcore AAR
        run: ./gradlew :Bcore:assembleRelease --stacktrace --no-daemon

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bcore-aar
          path: |
            NewBlackbox/Bcore/build/outputs/aar/*.aar
            NewBlackbox/Bcore/build/outputs/aar/*.zip
            NewBlackbox/Bcore/build/outputs/aar/aar-details.json
          if-no-files-found: error
